<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script defer src="index.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu,search" rel="stylesheet" />
    <script>
        window.MathJax = {
            tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']], // for inline math
            displayMath: [['$$', '$$'], ['\\[', '\\]']] // for block math
            }
        };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>
    <title>Math</title>
</head>
<body>
    <nav class="top-nav">
        <div class="title">
            <div class="logo"></div>
            <div class="name">WEBSITE NAME</div>
        </div>
    
        <div class="search-bar">
            <!-- search bar input -->
            <math-field id="search-problem-field"></math-field>
            <!-- confirm search button -->
            <button class="search-bar-icon"> <span class="material-symbols-outlined">search</span> </button>
        </div>
        <!-- more options button, to define -->
        <div>
            <div class="dropdown-container">
                <button class="dropdown-button">MATH</button>
                <div class="dropdown-content">
                    <a href="/Physics" class="dropdown-content-button">PHISICS</a>
                    <a href="/Chemistry" class="dropdown-content-button">MATH</a>
                </div>
            </div>
            <button>INTEGRALS</button>
        </div>
    </nav>
    <main>
        <div class="subject-button" id="math-subject"></div>
        <div class="subject-button" id="physics-subject"></div>
        <div class="subject-button" id="chemistry-subject"></div>


        <!-- here will go the buttons with the problem solutions sent by the server -->
    </main>
</body>
</html>
